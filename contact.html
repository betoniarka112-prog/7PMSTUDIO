    </head>

    <body>

        <section class = "nav_bar_sec">

            <div class="nav_bar">

                <ul>

                    <li><a href="index.html">START</a></li>
                    <li><a href="services.html">USLUGI</a></li>
                    <li><a href="contact.html">KONTAKT</a></li>
                    <li><a href="portfolio.html">PORTFOLIO</a></li>

                </ul>

            </div>

        </section>

        <section class = "valuation_sec">

            <div class = "container"  id = "valuation_sec_id">

                <div class="valuation_window">

                    <div class="val_left">
                        <p class="val_label">SKONTAKTUJ SIĘ</p>
                        <h2 class="val_heading">Porozmawiajmy<br>o Twoich<br>potrzebach!</h2>
                        <p class="val_desc">Masz pomysł, pytanie lub projekt? Skontaktuj się z nami — odpowiemy najszybciej jak się da!</p>
                    </div>

                    <div class="val_right">

                        <input id="from_name" class="val_input" type="text" placeholder="Jak masz na imię..." required />
                        <input id="reply_to" class="val_input" type="email" placeholder="Twój email..." required />

                        <div class="val_select_wrapper">

                            <select id="subject" class="val_select">

                                <option value="" disabled selected>Wybierz temat...</option>
                                <option value="REALIZACJA WOKALI">REALIZACJA WOKALI</option>
                                <option value="MIX MASTERING">MIX MASTERING</option>
                                <option value="KOMPLETMA REALIZACJA UTWORU">KOMPLETMA REALIZACJA UTWORU</option>
                                <option value="PRODUKCJA VIDEO">PRODUKCJA VIDEO</option>
                                <option value="MONTAŻ VIDEO">MONTAŻ VIDEO</option>
                                <option value="BEATY">BEATY</option>
                                <option value="INNE">INNE</option>

                            </select>

                        </div>

                        <textarea id="message" class="val_input val_textarea" placeholder="Twoja wiadomość..." required></textarea>
                        <button id="submit_btn" class="val_btn" onclick="sendMail()">Wyślij wiadomość</button>

                    </div>

                    <!-- Include EmailJS SDK before your script.js -->
                    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
                    <script type="text/javascript">

                        (function(){

                            emailjs.init("YOUR_PUBLIC_KEY"); // You get this from EmailJS Dashboard
                            
                        })();
                        
                    </script>

                </div>

            </div>

        </section>

        <script src="script.js"></script>

    </body>

</html>
